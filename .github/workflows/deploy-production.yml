name: Deploy Production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Vercel blocks deploys when the git commit author email is not a project
      # member. Detach git metadata for the upload so CI can deploy as the
      # token owner (same pattern as a clean CLI deploy without .git).
      - name: Detach git metadata for deploy auth
        run: rm -rf .git

      - name: Deploy to Production
        id: deploy
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --json > deploy.json
          url=$(python3 -c "import json; print(json.load(open('deploy.json'))['url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
